# VEGA-7 · 织女-7 —— darksynth 脉冲 + HUD 提示音。120 BPM，一个十六分音符 = 0.125 s = 画面 3.75 帧。
# 和 gen.ts 的时间点对齐：
#   0.375–1.375 s 自检日志五行，每行一声 beep（奇数十六分音符）
#   2.0–5.5 s 底层让开（能量压低），雷达扫到 C-01/02/03 各一声，视距每拍滚动一次各一声轻 chirp
#   4.0 s 扫描第一圈扫过 C-04：双响 + ding
#   5.5–6.5 s 锁定读数 0→100%：锁定音每个十六分音符升一级，6.0 s 起音乐被压出一个洞
#   6.5 s 括号落定 = 全画面翻橙：冲击 + 双音警报；6.57 s 俯冲 whoosh；8.5 s 着陆，城市标签逐个 pop
title: Vega-7
meta:
  bpm: 120
  key: D minor
  loop: false
  seed: 0

sections:
  - { name: boot,   bars: 1, energy: 0.42 }                      # 0:00–0:02
  - { name: search, bars: 1, energy: 0.35, at: "0:02" }           # 0:02–0:04 底层让开，提示音在前
  - { name: track,  bars: 1, energy: "0.4->0.8", at: "0:04" }     # 0:04–0:06 向锁定蓄力
  - { name: alert,  bars: 2, energy: "1.0->0.75", at: "0:06" }    # 0:06–0:10

harmony:
  boot:   "Dm"
  search: "Bb"
  track:  "Gm"
  alert:  "Dm Bb | Gm A"

tracks:
  pad:
    sound: synth-pad
    texture: pad
    in: all

  sub:
    sound: sub-bass
    texture: bass-sustain
    in: [boot]

  pulse:
    sound: synth-bass
    texture: bassline
    in: [search, track, alert]
    articulation: staccato
    rhythm: "1111 1111 1111 1111"
    by_section:
      search: {rhythm: "1.1. 1.1. 1.1. 1.1."}
      # the bar before the lock flash drops out for a beat, so the hit lands in a hole
      alert: {rhythm: ".... 1111 1111 1111 | 1111 1111 1111 1111"}

  beep:
    sound: chip-pulse
    texture: line
    gain: 7
    in: [boot, search, track, alert]
    notes:
      boot:   "r/16 r/16 r/16 D6/16' r/16 D6/16' r/16 D6/16' r/16 D6/16' r/16 A6/16' r/16 r/16 r/16 r/16"
      # C-01 / C-02 / C-03 flare as the sweep crosses them; the survey grid's own blip on the last 16th
      search: "r/16 r/16 r/16 A6/16' r/16 r/16 r/16 F6/16' r/16 r/16 r/16 A6/16' r/16 r/16 r/16 D7/16'"
      # the lock tone: one step up every 16th from the brackets opening (5.5 s) to the snap landing (6.5 s)
      track:  "D7/16' r/16 D7/16' r/16 r/4 r/4 D6/16' F6/16' A6/16' D7/16'"
      alert:  "E7/16' F7/16' A7/16' A7/16' r/4 r/2 | r/1"

  # the distance readout rolls on every beat of the search: a short high chirp each time it settles
  chirp:
    sound: chip-pulse
    texture: line
    gain: -3
    in: [search, track]
    notes:
      search: "r/16 r/16 r/16 E7/16' r/16 r/16 r/16 E7/16' r/16 r/16 r/16 E7/16' r/16 r/16 r/16 E7/16'"
      track:  "r/16 r/16 r/16 E7/16' r/16 r/16 r/16 E7/16' r/16 r/16 r/16 E7/16' r/4"

  # the alarm sounds twice at full voice, then sits ten dB down under the hold
  siren:
    sound: synth-lead
    texture: melody
    in: [alert]
    notes:
      alert: "r/4 A5/8 F5/8 A5/8 F5/8 r/4 | r/1"
  siren_low:
    sound: synth-lead
    texture: line
    gain: -10
    in: [alert]
    notes:
      alert: "r/2 r/4 A5/8 F5/8 | A5/8 F5/8 A5/8 F5/8 A5/8 F5/8 A5/4"

  drums:
    sound: drums-synth
    texture: groove
    in: [search, track, alert]
    pattern:
      kick:  "x... x... x... x..."
      snare: ".... x... .... x..."
      hat:   "xgxg xgxg xgxg xgxg"
    by_section:
      search:
        pattern:
          kick: "x... x... x... x..."
          hat:  "g.g. g.g. g.g. g.g."
      track:
        pattern:
          kick:  "x... x... x... x..."
          snare: ".... x... .... x..."
          hat:   "xgxg xgxg xgxg xgxg"
      alert:
        pattern:
          kick:  ".... X... x... x... | x... x... x... x..."
          snare: ".... .... .... x... | .... x... .... x..."
          hat:   ".... xgxg xgxg xgxg | xgxg xgxg xgxg xgxg"
          crash: ".... X... .... .... | .... .... .... ...."

sfx:
  - { type: impact, at: boot, level: 0.55 }
  - { type: whoosh, at: "0:02.0", level: 0.4 }
  - { type: ding, at: "0:04.0", level: 0.45 }
  # the lock counts up under a two-beat riser that arrives on the flip
  - { type: riser, at: "0:06.5", length: 2, level: 0.6 }
  # a near-silent pop whose only job is its duck: the bed drops out for the beat before the hit
  - { type: pop, at: "0:06.02", level: 0.02, duck: 18 }
  - { type: impact, at: "0:06.5", duck: 4, level: 0.85 }
  - { type: whoosh, at: "0:06.9", level: 0.5 }
  - { type: downlifter, at: "0:08.5", level: 0.35 }
  # city tags land one by one
  - { type: pop, at: "0:08.07", level: 0.22 }
  - { type: pop, at: "0:08.17", level: 0.2 }
  - { type: pop, at: "0:08.27", level: 0.18 }
  - { type: pop, at: "0:08.37", level: 0.16 }
