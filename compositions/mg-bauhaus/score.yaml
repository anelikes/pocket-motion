# EIN MODUL · 模数构成 —— 极简 techno / click。120 BPM，一拍 = 画面 15 帧，一小节 = 2 秒。
# 每个画面动作一记有音高的 blip，和 gen.ts 的拍号一一对应：
#   0.5–2.0 s 模块落下、翻滚三次（C D E G）· 2.25–2.625 s 一排四格依次跳起落下（四个十六分音符往上）
#   3.0 s 整排绕画面中心转（低音）· 3.5–5.75 s 六个形各走空格子入位，一拍或半拍一个（往下走）
#   5.5–6.0 s 踩镲和底鼓让出一拍 · 6.0 s 落拍：128 格各转 90°（冲击 + 低频下潜）
#   6.25–7.0 s 波一路把格子翻成同一个红模块（十六分音符往上）· 7.0 s 128 个同样的模块：钟声
#   7.5–8.0 s 反向的波翻回成海报（往下）· 8.0 s 和弦 · 8.0–8.75 s BAUHAUS 每个十六分音符盖一个字母
#   9.0 s 压印一记 · 9.5 s 四分之一圆自转一周，最后一记
title: Ein Modul
meta:
  bpm: 120
  key: C major
  loop: false
  seed: 0

sections:
  - { name: intro, bars: 1, energy: 0.45 }                     # 0:00–0:02
  - { name: build, bars: 2, energy: "0.55->0.75", at: "0:02" }  # 0:02–0:06
  - { name: drop,  bars: 1, energy: 1.0, at: "0:06" }           # 0:06–0:08
  - { name: outro, bars: 1, energy: 0.5, at: "0:08" }           # 0:08–0:10

harmony:
  intro: "Cmaj7"
  build: "Fmaj7 | G6"
  drop:  "Am9"
  outro: "Cmaj9"

tracks:
  # 每个动作一记 blip
  blip:
    sound: synth-pluck
    texture: line
    gain: 4
    in: [intro, build, drop, outro]
    notes:
      intro: "r/4 C6/4' D6/4' E6/4'"
      build: "G6/16' r/16 A6/16' C7/16' D7/16' E7/16' r/16 r/16 C4/4> G6/4' | E6/4' D6/8' C6/8' A5/4> G5/8' E5/8'"
      drop:  "r/16 r/16 A5/16' C6/16' E6/16' A6/16' C7/16' E7/16' r/4 E7/16' C7/16' A6/16' E6/16'"
      outro: "C6/16' D6/16' E6/16' G6/16' A6/16' C7/16' D7/16' r/16 r/4 C7/4'"

  # 128 个同样的红模块那一刻：一个钟声
  bell:
    sound: synth-bell
    texture: line
    in: [drop]
    notes:
      drop: "r/2 E6/2>"

  sub:
    sound: sub-bass
    texture: bass-sustain
    in: [intro, outro]

  bass:
    sound: synth-bass
    texture: bassline
    in: [build, drop]
    rhythm: "1.1. 1.1. 1.1. 1.8."

  pad:
    sound: synth-pad
    texture: pad
    in: [build, drop, outro]

  hit:
    sound: supersaw
    texture: comp
    in: [drop, outro]
    rhythm: "X--- ---- ---- ----"

  drums:
    sound: drums-electronic
    texture: groove
    in: [intro, build, drop, outro]
    pattern:
      kick: "x... x... x... x..."
      rim:  "..x. ..x. ..x. ..x."
    by_section:
      build:
        pattern:
          kick: "x... x... x... x... | x... x... x... ...."
          rim:  "..x. ..x. ..x. ..x. | ..x. ..x. ..x. ...."
          hat:  "x.x. x.x. x.x. x.x. | x.x. x.x. x.x. ...."
      drop:
        pattern:
          kick:  "X... x... x... x..."
          clap:  "X... x... .... x..."
          hat:   "xgxg xgxg xgxg xgxg"
          crash: "X... .... .... ...."
      outro:
        pattern:
          kick: "x... .... .... ...."
          rim:  "..x. ..x. ..x. ...."

sfx:
  - { type: whoosh, at: "0:03.0", level: 0.45 }
  - { type: riser, at: drop, length: 2, level: 0.45 }
  - { type: impact, at: drop, duck: 3, level: 0.8 }
  - { type: sub-drop, at: drop, level: 0.6 }
  - { type: pop, at: "0:08.0", level: 0.5 }
  - { type: impact, at: "0:09.0", level: 0.35 }
