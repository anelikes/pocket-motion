# EIN MODUL · 模数构成 —— 极简 techno / click。120 BPM，一拍 = 画面 15 帧，一小节 = 2 秒。
# 每个画面动作一记有音高的 blip，和 gen.ts 的拍号一一对应：
#   0.5–2.0 s 模块落下、翻滚三次（C D E G）· 2.25–2.625 s 一排四格依次跳起落下（四个十六分音符往上）
#   3.0 s 整排绕画面中心转（低音）· 3.5–5.75 s 六个形各走空格子入位，一拍或半拍一个（往下走）
#   5.82–6.0 s 底层让出一个八分音符 · 6.0 s 落拍（冲击），底鼓一路四拍踩到底
#   6.0–8.0 s 四道波，每拍一道、各从一个角出发：有墨的格子各转四分之一圈，每道波一串十六分音符往上
#   8.0 s 海报落回原位，横梁绕右端立起成竖条：和弦 + 钟声 · 8.27–9.0 s BAUHAUS 每个十六分音符镂空一个字母
#   9.0 s 色版错位一下又对准：一记低音
title: Ein Modul
meta:
  bpm: 120
  key: C major
  loop: false
  seed: 0

sections:
  - { name: intro, bars: 1, energy: 0.45 }                     # 0:00–0:02
  - { name: build, bars: 2, energy: "0.55->0.75", at: "0:02" }  # 0:02–0:06
  - { name: drop,  bars: 1, energy: 1.0, at: "0:06" }           # 0:06–0:08
  - { name: outro, bars: 1, energy: 0.5, at: "0:08" }           # 0:08–0:10

harmony:
  intro: "Cmaj7"
  build: "Fmaj7 | G6"
  drop:  "Am9"
  outro: "Cmaj9"

tracks:
  # 每个动作一记 blip
  blip:
    sound: synth-pluck
    texture: line
    gain: 4
    in: [intro, build, drop, outro]
    notes:
      intro: "r/4 C6/4' D6/4' E6/4'"
      build: "G6/16' r/16 A6/16' C7/16' D7/16' E7/16' r/16 r/16 C4/4> G6/4' | E6/4' D6/8' C6/8' A5/4> G5/8' E5/8'"
      drop:  "A5/16' C6/16' E6/16' A6/16' B5/16' D6/16' F6/16' B6/16' C6/16' E6/16' G6/16' C7/16' E6/16' G6/16' B6/16' E7/16'"
      # the floor standing up on the downbeat, then the seven knock-outs on sixteenths
      outro: "C4/8> C6/16' D6/16' E6/16' G6/16' A6/16' C7/16' D7/16' r/16 r/8 r/4"

  # 海报落回原位那一刻：一个钟声
  bell:
    sound: synth-bell
    texture: line
    in: [outro]
    notes:
      outro: "E6/2> r/2"

  sub:
    sound: sub-bass
    texture: bass-sustain
    in: [intro, outro]

  bass:
    sound: synth-bass
    texture: bassline
    in: [build]
    rhythm: "1.1. 1.1. 1.1. 1.8."

  pad:
    sound: synth-pad
    texture: pad
    in: [build, drop, outro]

  hit:
    sound: supersaw
    texture: comp
    in: [drop, outro]
    rhythm: "X--- ---- ---- ----"

  drums:
    sound: drums-electronic
    texture: groove
    in: [intro, build, drop, outro]
    pattern:
      kick: "x... x... x... x..."
      rim:  "..x. ..x. ..x. ..x."
    by_section:
      build:
        pattern:
          kick: "x... x... x... x... | x... x... x... ...."
          rim:  "..x. ..x. ..x. ..x. | ..x. ..x. ..x. ...."
          hat:  "x.x. x.x. x.x. x.x. | x.x. x.x. x.x. ...."
      drop:
        pattern:
          kick:  "X... x... x... x..."
          clap:  "X... x... .... x..."
          hat:   "xgxg xgxg xgxg xgxg"
          crash: "X... .... .... ...."
      outro:
        pattern:
          kick: "x... x... x... ...."
          rim:  "..x. ..x. ..x. ...."

sfx:
  - { type: whoosh, at: "0:03.0", level: 0.45 }
  - { type: riser, at: drop, length: 2, level: 0.45 }
  # a near-silent pop whose only job is its duck: the bed drops out for the eighth before the drop
  - { type: pop, at: "0:05.82", level: 0.02, duck: 14 }
  - { type: impact, at: drop, level: 0.8 }
  - { type: pop, at: "0:08.0", level: 0.5 }
  - { type: impact, at: "0:09.0", level: 0.35 }
