# EIN MODUL · 一个模块 —— 极简 techno / click。120 BPM，一拍 = 画面 15 帧，一小节 = 2 秒。
# 每个画面动作一记有音高的 blip，和 gen.ts 的拍号一一对应：
#   0.5–2.5 s 模块翻滚五次（C D E G A，一路往上）· 3.0 s 整排绕画面中心转（低音一记）
#   3.5–5.5 s 五个形飞进海报（往下走回 G）· 6.0 s 瓷砖铺满（冲击）· 6.5/7.0 s 两道波 · 7.5 s 落成圆阵
#   8.0 s 瓷砖退场、BAUHAUS 升起 · 8.5–9.5 s 轴心圆环三次呼吸
title: Ein Modul
meta:
  bpm: 120
  key: C major
  loop: false
  seed: 0

sections:
  - { name: intro, bars: 1, energy: 0.45 }                     # 0:00–0:02
  - { name: build, bars: 2, energy: "0.55->0.75", at: "0:02" }  # 0:02–0:06
  - { name: drop,  bars: 1, energy: 1.0, at: "0:06" }           # 0:06–0:08
  - { name: outro, bars: 1, energy: 0.5, at: "0:08" }           # 0:08–0:10

harmony:
  intro: "Cmaj7"
  build: "Fmaj7 | G6"
  drop:  "Am9"
  outro: "Cmaj9"

tracks:
  # 每个动作一记 blip
  blip:
    sound: synth-pluck
    texture: line
    gain: 4
    in: [intro, build, drop, outro]
    notes:
      intro: "r/4 C6/4' D6/4' E6/4'"
      build: "G6/4' A6/4' C4/4> G6/4' | E6/4' C6/4' A5/4' G5/4'"
      drop:  "A6/16' E6/16' C6/16' A5/16' r/4 B6/16' G6/16' E6/16' B5/16' r/4"
      outro: "C6/4> E6/4' G6/4' C7/4'"

  # 落成圆阵那一刻：一个钟声
  bell:
    sound: synth-bell
    texture: line
    in: [drop]
    notes:
      drop: "r/2 r/4 E6/4>"

  sub:
    sound: sub-bass
    texture: bass-sustain
    in: [intro, outro]

  bass:
    sound: synth-bass
    texture: bassline
    in: [build, drop]
    rhythm: "1.1. 1.1. 1.1. 1.8."

  pad:
    sound: synth-pad
    texture: pad
    in: [build, drop, outro]

  hit:
    sound: supersaw
    texture: comp
    in: [drop, outro]
    rhythm: "X--- ---- ---- ----"

  drums:
    sound: drums-electronic
    texture: groove
    in: [intro, build, drop, outro]
    pattern:
      kick: "x... x... x... x..."
      rim:  "..x. ..x. ..x. ..x."
    by_section:
      build:
        pattern:
          kick: "x... x... x... x... | x... x... x... ...."
          rim:  "..x. ..x. ..x. ..x. | ..x. ..x. ..x. ...."
          hat:  "x.x. x.x. x.x. x.x. | x.x. x.x. x.x. ...."
      drop:
        pattern:
          kick:  "X... x... x... x..."
          clap:  ".... x... .... x..."
          hat:   "xgxg xgxg xgxg xgxg"
          crash: "X... .... .... ...."
      outro:
        pattern:
          kick: "x... .... .... ...."
          rim:  "..x. ..x. ..x. ...."

sfx:
  - { type: riser, at: drop, length: 2, level: 0.45 }
  - { type: impact, at: drop, duck: 3, level: 0.8 }
  - { type: whoosh, at: "0:03.1", level: 0.45 }
  - { type: pop, at: "0:08.0", level: 0.5 }
  - { type: impact, at: "0:09.0", level: 0.35 }
