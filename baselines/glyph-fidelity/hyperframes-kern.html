<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "HOS"; src: url("assets/HarmonyOS_Sans_Regular.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      /* kerning on, ligatures off, so only pair adjustment separates the two. */
      .t { position: absolute; left: 40px; color: #fff; font-family: "HOS"; font-size: 64px;
           white-space: pre; font-kerning: normal; font-variant-ligatures: none; }
      #tick { position: absolute; left: -50px; top: -50px; width: 1px; height: 1px; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2"
         data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="2" data-track-index="1">
      <div class="t" style="top:40px;">P.</div>
      <div class="t" style="top:112px;">F,</div>
      <div class="t" style="top:184px;">LT</div>
      <div class="t" style="top:256px;">Ta</div>
      <div class="t" style="top:328px;">To</div>
      <div class="t" style="top:400px;">r.</div>
      <div class="t" style="top:472px;">Yo</div>
      <div class="t" style="top:544px;">AV</div>
      <div class="t" style="top:616px;">VA</div>
      <div class="t" style="top:688px;">W.</div>
      <div class="t" style="top:760px;">Wa</div>
      <div class="t" style="top:832px;">Av</div>
      <div class="t" style="top:904px;">av</div>
      <div class="t" style="top:976px;">ry</div>
        <div id="tick"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#tick", { x: 1, duration: 2, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
